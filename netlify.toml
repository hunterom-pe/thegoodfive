[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Exempt ONLY values that are public by design from Netlify's secret scanner:
  # the Supabase anon key (bundled into the site) and the AI provider's base URL
  # (a public web address that also appears in .env.example). Real secrets such as
  # OPENAI_API_KEY, GENERATION_SECRET and SUPABASE_SERVICE_ROLE_KEY must never be listed here.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,OPENAI_BASE_URL"

# Single-page app: every route is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/editor/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
